[project]
name = "rag-graphrag-research"
version = "0.1.0"
description = "Local research comparison of dense RAG and graph-based retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "numpy>=2.2,<3",
    "pip>=24.2",
    "pre-commit>=4.3,<5",
    "pyarrow>=19,<20",
    "pytest>=8.4,<9",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
    "ruff==0.11.13",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
files = ["scripts/check.py", "scripts/precommit_check.py", ".codex/hooks/stop_check.py"]
strict = true
