name: Research checks

env:
  UV_PROJECT_ENVIRONMENT: .venv-check

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Check branch and PR title
        run: |
          echo "$BRANCH" | grep -Eq '^codex/[a-z0-9._-]+$' || {
            echo 'Branch must be codex/<short-description>'; exit 1;
          }
          echo "$TITLE" | grep -Eq '^(feat|fix|refactor|docs|test|chore|exp): .+' || {
            echo 'PR title must start with a change type'; exit 1;
          }
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: docker run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner .
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check private keys, file sizes and config syntax
        env:
          SKIP: offline-check,gitleaks-docker
        run: uvx pre-commit run --all-files
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install locked check dependencies
        run: uv sync --locked
      - name: Run offline checks
        run: uv run --locked python -m scripts.check
