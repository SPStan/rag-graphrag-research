name: Offline checks

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: docker run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner .
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-check.lock.txt
      - name: Install isolated check dependencies
        run: python -m pip install -r requirements-check.lock.txt
      - name: Run offline checks
        run: python -m scripts.check
