name: Offline checks

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-check.lock.txt
      - name: Install isolated check dependencies
        run: python -m pip install -r requirements-check.lock.txt
      - name: Run offline checks
        run: python -m scripts.check
      - name: Measure remaining lint debt
        continue-on-error: true
        run: |
          python -m ruff check --statistics scripts data tests
          python -m ruff format --check scripts data tests
