repos:
  - repo: local
    hooks:
      - id: offline-check
        name: offline check
        entry: python scripts/precommit_check.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-docker
