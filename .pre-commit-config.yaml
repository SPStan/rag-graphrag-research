repos:
  - repo: local
    hooks:
      - id: offline-check
        name: offline check
        entry: python scripts/precommit_check.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-docker
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=10240]
      - id: check-yaml
      - id: check-toml
